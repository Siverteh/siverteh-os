name: Personal consumer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate personal profile and pin
        run: python3 tools/check.py
      - name: Verify pinned core and both prepared profiles
        run: |
          ./install.sh --prepare /tmp/personal-preview
          ./install.sh --profile default --prepare /tmp/general-preview
